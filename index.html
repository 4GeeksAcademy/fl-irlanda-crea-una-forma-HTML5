<!doctype html>
<html lang="en">
  <head>
    <!-- Etiquetas meta requeridas -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">

    <title>Paiment form example</title>
  </head>
  <body>
    <div class="container-fluid my-2">
      <!-- Use el componente .card para generar header, body y footer -->
      <div class="card mb-2">
        <div class="card-header bg-light"><h1>Paiment form example</h1></div>
        <div class="card-body">
          <!-- Alerta -->
          <div class="row">
            <div class="col-12 alert alert-danger" role="alert">
              Some fields are missing
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-6">
              <label for="CardNumber" class="form-label">Card#</label>
              <input type="number" class="form-control" id="CardNumber" placeholder="XXXXXXXXXXXXXXXX" required>
            </div>
            <div class="col-3">
              <label for="CVC" class="form-label">CVC</label>
              <input type="password" class="form-control" id="CVC" placeholder="***" required>
            </div>
            <div class="col-3">  <label for="Amount" class="form-label">Amount ($)</label>
              <input type="number" class="form-control" id="Amount" placeholder="0.00" required>
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-6">  <label for="FisrtName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="FirstName" placeholder="Mark" required>
            </div>
            <div class="col-6">  <label for="LastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="LastName" placeholder="Smith" required>
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-6">
              <label for="City" class="form- ">City</label>
              <input type="text" class="form-control" id="City">
            </div>
            <div class="col-3">
              <label for="State" class="form-label">State</label>
              <input class="form-control" list="datalistOptions" id="State" placeholder="Pick a option" required>
              <datalist id="datalistOptions">
                <option value="California">
                <option value="New York">
                <option value="Washington">
                <option value="Virginia">
                <option value="Illinois">
              </datalist>
            </div>
            <div class="col-3">
              <label for="CP" class="form-label">Postal Code</label>
              <input type="number" class="form-control" id="CP" placeholder="XXXXX" required>
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-6">
              <div>We accept:</div>
              <div class="d-flex">
                <div class="form-check bg-secondary">
                  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
                  <label class="form-check-label me-1" for="flexRadioDefault2">
                    <img src="/credit-card.svg" alt="CreditCard">
                  </label>
                </div>
                <div class="form-check bg-secondary">
                  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                  <label class="form-check-label me-1" for="flexRadioDefault1">
                    <img src="/credit-card.svg" alt="CreditCard">
                  </label>
                </div>
                <div class="form-check bg-secondary">
                  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                  <label class="form-check-label me-1" for="flexRadioDefault1">
                    <img src="/credit-card.svg" alt="CreditCard">
                  </label>
                </div>
                <div class="form-check bg-secondary">
                  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                  <label class="form-check-label me-1" for="flexRadioDefault1">
                    <img src="/credit-card.svg" alt="CreditCard">
                  </label>
                </div>
              </div>
            </div>
            <div class="col-6">
              <label for="Message" class="form-label">Message</label>
              <textarea class="form-control" id="Message" rows="3" aria-describedby="Instructions"></textarea>
              <div id="Instructions" class="form-text">Add any notes here.</div>
            </div>
          </div>
        </div>
        <!-- .text-end mueve los buttons a la derecha -->
        <div class="card-footer text-end bg-light">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Send</button>
        </div>
      </div>
    </div>
    <!-- JavaScript opcional -->
    <!-- Popper.js, luego Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.min.js" integrity="sha384-7VPbUDkoPSGFnVtYi0QogXtr74QeVeeIs99Qfg5YCF+TidwNdjvaKZX19NZ/e6oz" crossorigin="anonymous"></script>

  </body>
</html>
